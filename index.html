<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(255, 20, 80, 0.08) 0%, rgba(0, 0, 0, 1) 60%);
    }

    .heart-container {
      position: relative;
      width: min(88vmin, 680px);
      height: min(88vmin, 680px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-size: clamp(10px, 1.85vmin, 16px);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      color: rgba(255, 70, 120, 0.28);
      transform-origin: center center;
      will-change: color, text-shadow, transform, opacity;
      pointer-events: none;
    }

    .center-glow {
      position: absolute;
      width: 45%;
      height: 45%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 40, 100, 0.14) 0%, rgba(255, 40, 100, 0) 70%);
      filter: blur(24px);
      animation: breathe 3.6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.65;
      }
      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="heart-container" id="heart">
      <div class="center-glow"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('heart');
    const TOTAL_WORDS = 56;
    const words = [];

    // Parametric heart equation
    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t)
      );
      return { x, y };
    }

    // Create word elements along the heart curve
    for (let i = 0; i < TOTAL_WORDS; i++) {
      const t = (i / TOTAL_WORDS) * Math.PI * 2;
      const { x, y } = heartPoint(t);

      // Normalize to percentage of container
      const el = document.createElement('span');
      el.className = 'word';
      el.textContent = 'i love you';

      // Scale factor to fit nicely inside the container
      const scale = 2.65;
      const px = x * scale;
      const py = (y + 1.5) * scale; // slight vertical centering offset

      // Tangent angle so text follows the heart contour smoothly
      const dt = 0.01;
      const pNext = heartPoint(t + dt);
      const angle = Math.atan2(pNext.y - y, pNext.x - x) * (180 / Math.PI);

      el.style.transform = `translate(-50%, -50%) translate(${px}%, ${py}%) rotate(${angle}deg)`;
      // Store base transform and normalized position
      el.dataset.px = px;
      el.dataset.py = py;
      el.dataset.angle = angle;

      container.appendChild(el);
      words.push(el);
    }

    // Position using container dimensions so percentage translation is relative to container, not element width
    function layoutWords() {
      const rect = container.getBoundingClientRect();
      const unit = Math.min(rect.width, rect.height) / 100;

      for (let i = 0; i < TOTAL_WORDS; i++) {
        const el = words[i];
        const px = parseFloat(el.dataset.px) * unit;
        const py = parseFloat(el.dataset.py) * unit;
        const angle = parseFloat(el.dataset.angle);
        el.dataset.tx = px;
        el.dataset.ty = py;
        el.style.transform = `translate(-50%, -50%) translate(${px}px, ${py}px) rotate(${angle}deg)`;
      }
    }

    layoutWords();
    window.addEventListener('resize', layoutWords);

    // Animate a glowing wave orbiting around the heart
    let startTime = null;
    const CYCLE_DURATION = 4200; // ms per full circle

    function animate(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      const progress = (elapsed % CYCLE_DURATION) / CYCLE_DURATION; // 0..1

      for (let i = 0; i < TOTAL_WORDS; i++) {
        const pos = i / TOTAL_WORDS;
        // Circular distance between wave head and word
        let dist = Math.abs(pos - progress);
        if (dist > 0.5) dist = 1 - dist;

        // Smooth glow falloff
        const intensity = Math.max(0, 1 - dist / 0.22);
        const eased = Math.pow(intensity, 2.2);

        const el = words[i];
        const tx = el.dataset.tx;
        const ty = el.dataset.ty;
        const angle = el.dataset.angle;
        const scale = 1 + eased * 0.22;

        const r = Math.round(255);
        const g = Math.round(60 + eased * 175);
        const b = Math.round(115 + eased * 130);
        const alpha = 0.22 + eased * 0.78;

        el.style.color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        el.style.textShadow = eased > 0.05
          ? `0 0 ${6 + eased * 14}px rgba(255, 60, 130, ${0.4 + eased * 0.6}), 0 0 ${14 + eased * 26}px rgba(255, 20, 90, ${eased * 0.85})`
          : 'none';
        el.style.transform = `translate(-50%, -50%) translate(${tx}px, ${ty}px) rotate(${angle}deg) scale(${scale})`;
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
